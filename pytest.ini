[pytest]
pythonpath = .
testpaths = tests
markers =
    smoke: fast, critical-path checks (run on every push)
    regression: everything else (applied automatically)
    api: API layer tests (applied by folder)
    ui: UI layer tests (applied by folder)
    e2e: hybrid API + UI flows (applied by folder)
addopts =
    --strict-markers
    --browser chromium
    --tracing retain-on-failure
    --screenshot only-on-failure
    --output test-results
    --html reports/report.html
    --self-contained-html
